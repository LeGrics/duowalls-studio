<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DuoWalls Studio</title><style>body{font:16px system-ui;background:#10131a;color:#f4f5f8;max-width:720px;margin:auto;padding:22px}h1{font-size:28px}button,input{font:inherit}button,.upload{display:inline-block;background:#456aff;color:white;border:0;border-radius:12px;padding:12px;margin:8px 4px 8px 0;cursor:pointer}.upload input{display:none}canvas{display:block;width:100%;background:#262b36;border-radius:12px;margin:12px 0}#status{padding:12px;background:#252b38;border-radius:9px;white-space:pre-wrap}label{display:block;margin:12px 0}input[type=range]{width:100%}</style></head><body><h1>DuoWalls Studio</h1><p>Prototype de diagnostic pour Safari sur iPhone Duo. Les proportions sont provisoires.</p><label class="upload">Choisir une photo<input id="file" type="file" accept="image/*"></label><button id="demo">Tester avec une image de démonstration</button><p id="status">Initialisation…</p><label>Zoom <input id="zoom" type="range" min="1" max="3" step=".01" value="1"></label><label>Déplacement horizontal <input id="shift" type="range" min="-1" max="1" step=".01" value="0"></label><h3>Écran extérieur (aperçu)</h3><canvas id="outer" width="440" height="950"></canvas><h3>Écran intérieur (aperçu)</h3><canvas id="inner" width="950" height="680"></canvas><button id="export">Exporter l'écran intérieur (PNG)</button><script>
(function(){
const status=document.getElementById('status'),file=document.getElementById('file'),demo=document.getElementById('demo'),zoom=document.getElementById('zoom'),shift=document.getElementById('shift'),outer=document.getElementById('outer'),inner=document.getElementById('inner');
let img=null;const log=t=>status.textContent=t;
function draw(canvas){let c=canvas.getContext('2d');c.clearRect(0,0,canvas.width,canvas.height);if(!img)return;let w=canvas.width,h=canvas.height,z=+zoom.value,scale=Math.max(w/img.width,h/img.height)*z;let dw=img.width*scale,dh=img.height*scale,x=(w-dw)/2+(+shift.value)*(dw-w)/2,y=(h-dh)/2;c.drawImage(img,x,y,dw,dh)}
function render(){draw(outer);draw(inner)}
function load(src){let i=new Image();i.onload=()=>{img=i;log('Image chargée : '+i.width+' × '+i.height);render()};i.onerror=()=>log('Erreur : image non décodable par ce navigateur');i.src=src}
file.addEventListener('change',()=>{let f=file.files&&file.files[0];if(!f){log('Aucun fichier sélectionné');return}log('Chargement : '+f.name+' ('+f.type+')');let reader=new FileReader();reader.onload=()=>load(reader.result);reader.onerror=()=>log('Erreur de lecture du fichier');reader.readAsDataURL(f)});
demo.onclick=()=>{let c=document.createElement('canvas');c.width=900;c.height=700;let x=c.getContext('2d'),g=x.createLinearGradient(0,0,900,700);g.addColorStop(0,'#253a77');g.addColorStop(1,'#f6aa67');x.fillStyle=g;x.fillRect(0,0,900,700);x.fillStyle='#fff';x.font='bold 70px system-ui';x.fillText('DUOWALLS TEST',80,350);load(c.toDataURL('image/png'))};
zoom.oninput=render;shift.oninput=render;document.getElementById('export').onclick=()=>{if(!img){log('Choisis une photo avant export');return}let a=document.createElement('a');a.download='duowalls-inner.png';a.href=inner.toDataURL('image/png');a.click()};
log('JavaScript actif ✓ — prêt pour le test');
})();
</script></body></html>
